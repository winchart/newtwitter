<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitter Automation Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); width: 100%; max-width: 700px; }
        h2, h3 { color: #333; text-align: center; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #555; font-size: 14px; }
        textarea.multi-input { width: 100%; height: 100px; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: monospace; resize: vertical; }
        .grid-box { display: flex; gap: 15px; margin-bottom: 15px; }
        .grid-col { flex: 1; }
        
        /* শুধু ডট সংবলিত মিনিমাল স্ট্যাটাস বক্স */
        .status-box { display: flex; align-items: center; justify-content: space-between; background: #f1f1f1; padding: 10px 15px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; font-weight: bold; color: #444; }
        .status-indicator-wrapper { display: flex; align-items: center; gap: 8px; }
        .indicator { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: 0 0 5px rgba(0,0,0,0.2); }
        .offline { background-color: #dc3545; }
        .online { background-color: #28a745; }

        button { padding: 12px 15px; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; transition: background 0.3s; width: 100%; margin-top: 10px; font-weight: bold; }
        .btn-login { background-color: #17a2b8; color: white; }
        .btn-login:hover { background-color: #138496; }
        .btn-create-post { background-color: #ff9800; color: white; }
        .btn-create-post:hover { background-color: #e68a00; }
        .btn-start { background-color: #28a745; color: white; font-size: 16px; }
        .btn-start:hover { background-color: #218838; }

        .account-list { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 15px; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; }
        .account-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-bottom: 1px solid #eee; background: #fff; margin-bottom: 5px; border-radius: 4px; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 4px 8px; border-radius: 3px; cursor: pointer; font-weight: bold; }
        .delete-btn:hover { background: #cc0000; }

        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background-color: #fff; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #000; }
        .saved-post-box { background: #e8f4fd; padding: 10px; border-radius: 5px; border: 1px solid #bce8f1; margin-bottom: 15px; font-size: 14px; color: #31708f; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Twitter Automation System</h2>
        
        <!-- আপডেট করা স্ট্যাটাস ডট বক্স -->
        <div class="status-box">
            <span>System Status:</span>
            <div class="status-indicator-wrapper">
                <span id="statusIndicator" class="indicator offline"></span>
            </div>
        </div>

        <!-- ইউজারনেম ও পাসওয়ার্ডের বক্স -->
        <div class="grid-box">
            <div class="grid-col">
                <label>Usernames (one per line)</label>
                <textarea class="multi-input" id="usernames_box" placeholder="user1&#10;user2"></textarea>
            </div>
            <div class="grid-col">
                <label>Passwords (one per line)</label>
                <textarea class="multi-input" id="passwords_box" placeholder="pass1&#10;pass2"></textarea>
            </div>
        </div>

        <button type="button" class="btn-login" id="loginBtn" onclick="startLogin()">🔄 Login and create a profile</button>

        <h3 style="margin-top: 20px;">Profile List:</h3>
        <div class="account-list" id="profileListContainer">
            <div style="color: #888; text-align: center; padding: 10px;">কোনো প্রোফাইল তৈরি হয়নি</div>
        </div>

        <button type="button" class="btn-create-post" onclick="openModal()">📝 Create Post (Create post and image)</button>

        <div id="postPreview" class="saved-post-box" style="display: none; margin-top: 10px;">
            <b>Saved post:</b> <span id="previewText"></span><br>
            <span id="previewImage" style="font-size: 12px; color: #555;"></span>
        </div>

        <button type="button" class="btn-start" onclick="startPosting()">🚀 Start Post (Start posting on all profiles)</button>
    </div>

    <!-- Create Post পপ-আপ -->
    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3>পোস্ট ও ইমেজ সেটআপ</h3>
            <label>পোস্টের টেক্সট</label>
            <textarea id="modal_post_text" style="width:100%; height:90px; padding:8px; margin-top:5px; border:1px solid #ccc; border-radius:4px;" placeholder="এখানে পোস্টের টেক্সট লিখুন..."></textarea>

            <label style="margin-top:10px;">ছবি সিলেক্ট করুন (Image)</label>
            <input type="file" id="modal_post_image" accept="image/*" style="width:100%; margin-top:5px; margin-bottom:15px;">

            <button type="button" class="btn-start" onclick="savePostData()">💾 সেভ করুন</button>
        </div>
    </div>

    <script>
    const MASTER_KEY = "MY_TWITTER_SECRET_MASTER_KEY_2026";
    const BACKEND_URL = "https://newtwitter-production.up.railway.app";

    let profiles = JSON.parse(localStorage.getItem('twitter_profiles')) || [];
    let savedPost = JSON.parse(localStorage.getItem('twitter_saved_post')) || { text: "", imageName: "কোনো ছবি নেই" };

    async function checkMasterConnection() {
        const indicator = document.getElementById('statusIndicator');

        try {
            const response = await fetch(`${BACKEND_URL}/`, {
                method: 'GET',
                headers: { 'X-Master-Key': MASTER_KEY }
            });
            if (response.ok) {
                indicator.className = "indicator online";
            } else {
                throw new Error();
            }
        } catch (err) {
            indicator.className = "indicator offline";
        }
    }

    window.onload = function() {
        checkMasterConnection();
        updateProfileUI();
        
        if(savedPost.text) {
            document.getElementById('previewText').innerText = savedPost.text;
            document.getElementById('previewImage').innerText = "ফাইল: " + savedPost.imageName;
            document.getElementById('postPreview').style.display = 'block';
            document.getElementById('modal_post_text').value = savedPost.text;
        }
    };

    async function startLogin() {
        const usernamesText = document.getElementById('usernames_box').value.trim();
        const passwordsText = document.getElementById('passwords_box').value.trim();

        if(!usernamesText || !passwordsText) { alert("ইউজারনেম ও পাসওয়ার্ড দিন!"); return; }

        const users = usernamesText.split('\n').map(u => u.trim()).filter(u => u);
        const passes = passwordsText.split('\n').map(p => p.trim()).filter(p => p);

        const btn = document.getElementById('loginBtn');
        btn.innerText = "লগইন প্রসেসিং হচ্ছে...";
        btn.disabled = true;

        try {
            const response = await fetch(`${BACKEND_URL}/login-profiles`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Master-Key': MASTER_KEY 
                },
                body: JSON.stringify({ users, passes })
            });
            
            const result = await response.json();
            if(response.ok) {
                profiles = result.profiles || [];
                localStorage.setItem('twitter_profiles', JSON.stringify(profiles));
                updateProfileUI();
                alert(result.message || "সফলভাবে লগইন হয়েছে!");
            } else {
                alert("ত্রুটি: " + (result.message || "লগইন ব্যর্থ হয়েছে"));
            }
        } catch (err) {
            alert("সার্ভারের সাথে যোগাযোগ করতে সমস্যা হয়েছে!");
        } finally {
            btn.innerText = "🔄 Login and create a profile";
            btn.disabled = false;
        }
    }

    function updateProfileUI() {
        const container = document.getElementById('profileListContainer');
        if(profiles.length === 0) {
            container.innerHTML = '<div style="color: #888; text-align: center; padding: 10px;">কোনো প্রোফাইল তৈরি হয়নি</div>';
            return;
        }
        container.innerHTML = '';
        profiles.forEach((prof, index) => {
            container.innerHTML += `
                <div class="account-item">
                    <span><b>প্রোফাইল ${index + 1}:</b> ${prof.username || prof}</span>
                    <button class="delete-btn" onclick="deleteProfile(${index})" title="ডিলিট করুন">✕</button>
                </div>`;
        });
    }

    function deleteProfile(index) {
        profiles.splice(index, 1);
        localStorage.setItem('twitter_profiles', JSON.stringify(profiles));
        updateProfileUI();
    }

    function openModal() { document.getElementById('postModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('postModal').style.display = 'none'; }

    let selectedImageFile = null;

    function savePostData() {
        const text = document.getElementById('modal_post_text').value.trim();
        const imageInput = document.getElementById('modal_post_image');
        if(!text) { alert("পোস্টের টেক্সট লিখুন!"); return; }

        savedPost.text = text;
        if(imageInput.files.length > 0) {
            selectedImageFile = imageInput.files[0];
            savedPost.imageName = imageInput.files[0].name;
        } else {
            savedPost.imageName = "কোনো ছবি নেই";
        }

        localStorage.setItem('twitter_saved_post', JSON.stringify(savedPost));

        document.getElementById('previewText').innerText = savedPost.text;
        document.getElementById('previewImage').innerText = "ফাইল: " + savedPost.imageName;
        document.getElementById('postPreview').style.display = 'block';
        alert("পোস্ট সেভ হয়েছে!");
        closeModal();
    }

    async function startPosting() {
        if(profiles.length === 0) { alert("আগে প্রোফাইল তৈরি করুন!"); return; }
        if(!savedPost.text) { alert("আগে পোস্ট সেভ করুন!"); return; }

        const btn = document.querySelector('.btn-start');
        btn.innerText = "পোস্টিং চলছে...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append('profiles', JSON.stringify(profiles));
        formData.append('post_text', savedPost.text);
        if(selectedImageFile) {
            formData.append('image', selectedImageFile);
        }

        try {
            const response = await fetch(`${BACKEND_URL}/start-posting`, {
                method: 'POST',
                headers: {
                    'X-Master-Key': MASTER_KEY 
                },
                body: formData
            });
            
            const result = await response.json();
            alert(result.message || "পোস্টিং সম্পন্ন হয়েছে!");
        } catch (err) {
            alert("পোস্ট করতে সমস্যা হয়েছে!");
        } finally {
            btn.innerText = "🚀 Start Post (Start posting on all profiles)";
            btn.disabled = false;
        }
    }
    </script>
</body>
</html>
